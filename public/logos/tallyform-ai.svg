<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Three tally strokes (vertical) -->
  <line x1="14" y1="15" x2="14" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="15" x2="22" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="15" x2="30" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cross stroke (diagonal) -->
  <line x1="10" y1="34" x2="34" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
